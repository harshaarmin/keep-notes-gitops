
apiVersion: v1
kind: Service

metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: keep-notes
    component: backend

spec:
  type: {{ .Values.backend.service.type }}

  selector:
    app: keep-notes
    component: backend

  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.containerPort }}
      protocol: TCP
