
apiVersion: v1
kind: Service

metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app: keep-notes
    component: postgres

spec:
  type: ClusterIP

  selector:
    app: keep-notes
    component: postgres

  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
      protocol: TCP
