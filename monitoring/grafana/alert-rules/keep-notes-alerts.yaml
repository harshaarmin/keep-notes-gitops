              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                editorMode: code
                expr: |-
                    (
                      sum by (pod) (
                        container_memory_working_set_bytes{
                          namespace="default",
                          pod=~"keep-notes-backend-.*",
                          container!="",
                          container!="POD"
                        }
                      )
                      /
                      sum by (pod) (
                        kube_pod_container_resource_limits{
                          namespace="default",
                          pod=~"keep-notes-backend-.*",
                          resource="memory",
                          unit="byte"
                        }
                      )
                    ) * 100 or vector(0)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 80
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 5m
          annotations:
            description: A Keep Notes backend pod is using more than 80% of its configured memory limit. Check memory consumption and investigate potential memory leaks.
            summary: Keep Notes backend memory usage is high.
