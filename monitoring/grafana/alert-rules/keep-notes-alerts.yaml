apiVersion: 1
groups:
    - orgId: 1
      name: Keep Notes Alerts
      folder: Keep Notes
      interval: 1m
      rules:
        - uid: eg3yfwumi9logb
          title: Keep Notes - Backend Replicas Unavailable
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                editorMode: code
                expr: |-
                    (
                      kube_deployment_spec_replicas{
                        namespace="default",
                        deployment="keep-notes-backend"
                      }
                      -
                      kube_deployment_status_replicas_available{
                        namespace="default",
                        deployment="keep-notes-backend"
                      }
                    ) or vector(0)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            description: The number of available Keep Notes backend replicas is lower than the desired replica count. Check the backend deployment and pod health in Kubernetes.
            summary: Keep Notes backend replicas are unavailable.
          isPaused: false
          notification_settings:
            receiver: grafana-default-email
        - uid: dg3ygolh2klj4e
          title: Keep Notes - Backend Pod Restarts
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                editorMode: code
                expr: |-
                    sum(
                      increase(
                        kube_pod_container_status_restarts_total{
                          namespace="default",
                          pod=~"keep-notes-backend-.*",
                          container!="",
                          container!="POD"
                        }[5m]
                      )
                    ) or vector(0)
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          for: 1m
          annotations:
            description: A Keep Notes backend container restart was detected within the last 5 minutes. Check the backend pod logs and Kubernetes events to investigate.
            summary: Keep Notes backend container has restarted.
          isPaused: false
          notification_settings:
            receiver: grafana-default-email
