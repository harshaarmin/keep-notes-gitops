
apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-alerting
  namespace: monitoring

data:
  keep-notes-alerts.yaml: |
    {{- .Files.Get "alert-rules/keep-notes-alerts.yaml" | nindent 4 }}

  grafana-default-email.yaml: |
    {{- .Files.Get "contact-points/grafana-default-email.yaml" | nindent 4 }}

  keep-notes-notification-policies.yaml: |
    {{- .Files.Get "notification-policies/keep-notes-notification-policies.yaml" | nindent 4 }}
