
apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-dashboard-provider
  namespace: monitoring

data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Keep Notes
        orgId: 1
        folder: Keep Notes
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards
