
apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana
  namespace: monitoring

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      securityContext:
        fsGroup: 472

      containers:
        - name: grafana
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: grafana
              containerPort: 3000
              protocol: TCP

          env:
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.admin.user | quote }}

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password

            - name: GF_SMTP_ENABLED
              value: "true"

            - name: GF_SMTP_HOST
              value: "smtp.gmail.com:587"

            - name: GF_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-smtp
                  key: smtp-user

            - name: GF_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-smtp
                  key: smtp-password

            - name: GF_SMTP_FROM_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: grafana-smtp
                  key: smtp-user

            - name: GF_SMTP_FROM_NAME
              value: "Keep Notes Grafana"

            - name: GF_SMTP_STARTTLS_POLICY
              value: "Mandatory"

            - name: GRAFANA_ALERT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: grafana-alert-email
                  key: recipient-email 

          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true

            - name: grafana-alerting
              mountPath: /etc/grafana/provisioning/alerting
              readOnly: true

            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true

            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true

            - name: grafana-data
              mountPath: /var/lib/grafana

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources

        - name: grafana-alerting
          configMap:
            name: grafana-alerting

        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider

        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards

        - name: grafana-data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName }}
